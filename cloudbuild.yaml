steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - random-redirect
      - --gen2
      - --runtime=go125
      - --region=us-west1
      - --source=.
      - --entry-point=RandomRedirect
      - --trigger-http
      - --allow-unauthenticated
      # The sheet ID is not a secret: only accounts the sheet is shared with can read it.
      - --set-env-vars=SHEET_ID=1wInfgU8QCmAfmTilZoIav3kgsCsg8ojG-IXRcw6Kbmw
      - --clear-secrets

options:
  logging: CLOUD_LOGGING_ONLY

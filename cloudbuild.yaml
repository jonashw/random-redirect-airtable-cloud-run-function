steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - random-redirect
      - --gen2
      - --runtime=go125
      - --region=us-west1
      - --source=.
      - --entry-point=RandomRedirect
      - --trigger-http
      - --allow-unauthenticated
      - --set-secrets=SHEET_ID=SHEET_ID:latest

options:
  logging: CLOUD_LOGGING_ONLY

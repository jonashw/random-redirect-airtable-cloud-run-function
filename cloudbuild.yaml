steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - random-redirect
      - --gen2
      - --runtime=go125
      - --region=us-west1
      - --source=.
      - --entry-point=RandomRedirect
      - --trigger-http
      - --allow-unauthenticated
      - --set-secrets=AIRTABLE_API_KEY=AIRTABLE_API_KEY:latest,AIRTABLE_BASE_ID=AIRTABLE_BASE_ID:latest,AIRTABLE_TABLE_ID=AIRTABLE_TABLE_ID:latest,AIRTABLE_WEBHOOK_ID=AIRTABLE_WEBHOOK_ID:latest,AIRTABLE_WEBHOOK_MAC_SECRET=AIRTABLE_WEBHOOK_MAC_SECRET:latest,REFRESH_TOKEN=REFRESH_TOKEN:latest

options:
  logging: CLOUD_LOGGING_ONLY
